# =============================================================================
# WandB Sweep Configuration for Lake-Vision
# =============================================================================
# Grid search focused on attention mechanisms and input stream combinations
#
# Usage:
#   1. Create sweep (login node): wandb sweep sweep.yaml
#   2. Run agent (compute node):  sbatch run_sweep.sh <sweep_id>
#   3. Sync results (login node): wandb sync wandb/offline-run-*
# =============================================================================

name: lakevision-sweep-v1
program: run_training.py
method: grid

metric:
  name: val_precision
  goal: maximize

# =============================================================================
# PARAMETER GRID
# =============================================================================
# Priority 1: Attention types (6 options)
#   0 = none (RGB only, no attention)
#   1 = blurmask as input channel (no CBAM)
#   2 = RGB * blurmask as input (no CBAM)
#   3 = CBAM spatial attention (RGB only)
#   4 = CBAM spatial attention (RGB + blurmask)
#   5 = architectural attention (separate mask pathway)
#
# Priority 2: Input stream combinations (4 options)
#   use_areaseq:   include water area time series
#   use_cloudyseq: include cloudy pixel fraction time series
#
# Priority 3: Training hyperparameters (2 options)
#   optimizer: Adam vs SGD
#
# Total combinations: 6 x 2 x 2 x 2 = 48 runs
# =============================================================================

parameters:
  # -------------------------
  # HIGH PRIORITY: Attention
  # -------------------------
  attention_type:
    values: [0, 1, 2, 3, 4, 5]

  # -------------------------
  # MEDIUM PRIORITY: Input streams
  # -------------------------
  use_imgseq:
    value: true  # always use image sequence (core input)

  use_areaseq:
    values: [false, true]

  use_cloudyseq:
    values: [false, true]

  # -------------------------
  # LOW PRIORITY: Training params
  # -------------------------
  optimizer:
    values: ["Adam", "SGD"]

  lr:
    value: 0.001  # fixed for now

  batch_size:
    value: 16  # fixed for now

  # -------------------------
  # FIXED: Architecture params
  # -------------------------
  num_epochs:
    value: 250

  seq_len:
    value: 51

  num_classes:
    value: 4

  # Frontend CNN
  frontcnn_base_channels:
    value: 8

  frontcnn_num_layers:
    value: 3

  # ConvLSTM
  clstm_hidden:
    value: 32

  # Scalar LSTM
  slstm_hidden:
    value: 16

  # Random seed
  seed:
    value: 42

# =============================================================================
# COMMAND TEMPLATE
# =============================================================================
# WandB substitutes ${args} with sweep parameters
# Required paths are passed explicitly (not swept)
# =============================================================================

command:
  - ${env}
  - python3
  - ${program}
  - --dir_tstacks
  - /oak/stanford/groups/cyaolai/JoshRines/data/tstacks/CW2019_tstacks/
  - --labels_csv
  - /oak/stanford/groups/cyaolai/JoshRines/repos/lake-vision/sandbox/labels_ND_ED_LD_CD_2019CW.csv
  - --dunmire_nc
  - /oak/stanford/groups/cyaolai/JoshRines/repos/lake-vision/sandbox/all_lakes_2019.nc
  - --output_dir
  - /oak/stanford/groups/cyaolai/JoshRines/sherlock/sherlock_lakevision/outputs
  - --wandb_project
  - lake-vision
  - ${args}
