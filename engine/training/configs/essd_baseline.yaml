# Canonical ESSD training config. Shared across all ESSD runs
# (combined, crossyear, learning curve, pilot). Experiment-specific
# overrides live in sibling YAMLs that set base_config: essd_baseline.yaml.
#
# STATUS (2026-04-12): staged but NOT yet wired into run_training.py.
# The SLURM scripts still pass flags on the command line. This file
# exists as the canonical record of the design; the wiring work is
# deferred until after the pilot run validates end-to-end plumbing.
#
# When wired, invocation will look like:
#   python run_training.py --config configs/essd_combined.yaml \
#       --labels_csv ... --nc_dir ...    # path overrides via CLI

# --- Label scheme ---
label_mode: essd_5class          # ND / HF / MD / LD / CD
id_col: lake_id
label_col: label
num_classes: 5

# --- Data / sequence ---
seq_len: 153                     # full May-Sep daily window (no water_area peak centering)
no_mask: true                    # raw sat-tile-stack NC files have no lake polygon mask
use_areaseq: false               # imagery-only ESSD baseline — water_area not in raw files
use_cloudyseq: false             # deferred to JSTARS
# use_nir, use_swir16, use_swir22 default to False — imagery-only (RGB) baseline for ESSD

# --- Model architecture (base capacity) ---
attention_type: none
frontcnn_base_channels: 8
frontcnn_num_layers: 4
clstm_hidden: 32
slstm_hidden: 16
classhead_hidden: 64
classhead_dropout: 0.3

# --- Optimization ---
batch_size: 8                    # bs=16 + AMP OOMs on 40GB A100 at 512x512 + seq_len=153
                                 #   (input tensor alone is 14.7 GB at bs=16)
amp: true                        # bf16 mixed precision on A100
epochs: 50
lr: 1.0e-4
weight_decay: 1.0e-5
use_scheduler: true

# --- Training runtime ---
num_workers: 4
seed: 42
